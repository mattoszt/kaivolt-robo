name: Robô Kaivolt

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:
    inputs:
      teste_telegram:
        description: "Postar 1 oferta agora no Telegram (teste)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: robo-kaivolt
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar ofertas e publicar no site
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_SECRET: ${{ secrets.ALI_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PASTA: ${{ secrets.FTP_PASTA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python robo.py ${{ github.event.inputs.teste_telegram == 'true' && '--tg-teste' || '' }}

      - name: Guardar histórico de preços
        if: always()          # guarda o histórico mesmo se a trava de segurança parar a publicação
        run: |
          git config user.name "robo-kaivolt"
          git config user.email "robo@kaivolt.com.br"
          git add historico.json
          git diff --staged --quiet || git commit -m "histórico de preços"
          git pull --rebase --quiet || true
          git push
